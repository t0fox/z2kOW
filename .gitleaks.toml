# .gitleaks.toml — что скан секретов обязан НЕ считать утечкой, и почему.
#
# Правила по умолчанию остаются в силе целиком (useDefault), здесь только
# исключения по ПУТЯМ — для классов файлов, где длинные случайные строки лежат
# по своей природе. До 14.09.2026 конфига не было, и из 61 находки скана 60
# были такими: security.yml краснел неделями, и настоящая находка тонула в шуме.
#
# Синтаксис [allowlist] — под gitleaks 8.24.3, который прибит в security.yml
# (GITLEAKS_VERSION). В 8.25 его заменили на [[allowlists]]; меняя версию,
# меняйте и этот файл.
#
# СОЗНАТЕЛЬНО НЕ ИСКЛЮЧЕНО: файлы, где секрет живёт по делу (скрипт обновления
# адресов Instagram, клиент туннеля, cf-worker). Находки там — настоящие, и
# глушить их путём значит прятать проблему, а не решать её.
title = "z2k"

[extend]
useDefault = true

[allowlist]
description = "Файлы, где длинные случайные строки — не секреты"
paths = [
    # Манифест обновлений: карта sha256 каждого файла и подпись Ed25519.
    # Генерируется release.sh, секретов в нём не бывает.
    '''^UPDATES\.json$''',
    '''^UPDATES\.json\.sig$''',
    # Тестовые фикстуры: ключи и токены, придуманные для теста.
    '''_test\.go$''',
    # Вендоренные примеры WireGuard — их ключи из документации апстрима.
    '''^z2k-warpd/third_party/''',
]
