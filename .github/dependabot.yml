# Автоматические PR на обновление зависимостей. Без этого SHA-пиннинг экшенов
# в workflows превратился бы в вечную заморозку: пин фиксирует supply chain,
# dependabot двигает его вперёд осознанными PR (и в комменте к пину держит
# человекочитаемую версию). go-модули — то, из чего собираются бинарники для
# роутеров: их бампы тем более должны проходить через PR + CI, а не через
# случайный `go get -u` перед релизом.
#
# PR — это ПРЕДЛОЖЕНИЕ: мерджится руками после зелёного CI, в релизы попадает
# по обычному релизному циклу.
#
# target-branch ОБЯЗАТЕЛЕН у каждой записи. Без него dependabot целится в ветку
# по умолчанию, а она у нас — z2k-enhanced, то есть КАНАЛ ДОСТАВКИ: с её
# верхушки роутеры тянут манифест и файлы, и двигает её только publish.yml
# после зелёного CI. Влитый туда PR попал бы к людям сразу, минуя релиз и
# манифест. Так и пришёл #32 (закрыт): бамп go-модулей, нацеленный прямо в
# релизную ветку. Человек пишет в z2k-staging — бот тоже.
#
# cooldown — выдержка перед тем, как версия вообще будет предложена. Смысл не в
# аккуратности, а в supply chain: скомпрометированный релиз пакета живёт до
# обнаружения обычно считанные дни, и принимать версию, выпущенную час назад,
# значит подписываться на это первыми. Дефолт GitHub — 3 дня, нам этого мало
# для мажоров: они и так требуют разбора руками, подождать две недели ничего
# не стоит. На ИСПРАВЛЕНИЯ БЕЗОПАСНОСТИ выдержка не распространяется, это
# сказано в документации прямо — то есть дыры мы всё равно получаем сразу.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: z2k-staging
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # ТОЛЬКО default-days, и это не упущение. В таблице поддержки cooldown у
      # GitHub Actions отмечен default-days и НЕ отмечены semver-major-days,
      # semver-minor-days и semver-patch-days — эти три ключа работают лишь для
      # экосистем с SemVer (gomod ниже — работают). Проставленные здесь, они
      # роняли разбор всего файла, и dependabot переставал обновлять что-либо
      # вообще: одна невалидная запись обесценивает и вторую, валидную.
      # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /mtproxy-client
      - /rt-proxy
      - /vps-relay
      - /z2k-detect
      - /z2k-verify
      - /z2k-warpd
    target-branch: z2k-staging
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    # ВЕРСИИ, ТРЕБУЮЩИЕ GO 1.26, НЕ ПРЕДЛАГАТЬ.
    #
    # golang.org/x/crypto 0.56.0, x/net 0.58.0 и x/sys 0.48.0 объявляют
    # `go 1.26.0`, и бамп на них поднимает директиву go в модуле. Ветка 1.26.x
    # нам закрыта: на MIPS её рантайм ломается (golang/go#77730, см. ci.yml у
    # GO_VERSION). Так пришёл #58 (14.09.2026, закрыт) — в нём падали сборки трёх
    # модулей с «go.mod requires go >= 1.26.0».
    #
    # Цена этого правила названа честно. Документация помечает ignore значками
    # И version updates, И security updates — то есть оно глушит и
    # PR-исправления безопасности для этих модулей. Потерь в мердже это не
    # даёт: такой PR всё равно не влить без Go 1.26. А сигнал об уязвимости
    # остаётся у govulncheck в security.yml, который сверяет модули целиком.
    #
    # Снимать вместе с переходом на Go 1.26 — когда MIPS-проблему закроют или
    # когда для неё найдётся обход.
    ignore:
      - dependency-name: "golang.org/x/crypto"
        versions: [">= 0.56.0"]
      - dependency-name: "golang.org/x/net"
        versions: [">= 0.58.0"]
      - dependency-name: "golang.org/x/sys"
        versions: [">= 0.48.0"]
