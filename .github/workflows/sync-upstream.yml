name: Check live upstream z2k releases

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: check-upstream-main
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Fetch uncached upstream branch commit and UPDATES.json
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(date +%s%N)"
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'Cache-Control: no-cache' \
            "https://api.github.com/repos/necronicle/z2k/branches/z2k-enhanced?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-branch.json"
          commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"]["sha"])' "$RUNNER_TEMP/upstream-branch.json")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL -H 'Cache-Control: no-cache' \
            "https://raw.githubusercontent.com/necronicle/z2k/$commit/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-UPDATES.json"
          printf '%s\n' "$commit" > "$RUNNER_TEMP/upstream-commit"
      - name: Compare live release sequence to the one controlled manifest
        shell: bash
        run: |
          set -euo pipefail
          commit="$(cat "$RUNNER_TEMP/upstream-commit")"
          if python3 scripts/openwrt/controlled_release.py check-upstream \
              --upstream "$RUNNER_TEMP/upstream-UPDATES.json" \
              --commit "$commit" \
              --controlled UPDATES.json; then
            echo 'No newer upstream release.' >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if [ "$rc" -ne 3 ]; then exit "$rc"; fi
            echo 'A new upstream release needs OpenWrt adaptation and review.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
