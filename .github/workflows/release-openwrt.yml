name: OpenWrt trusted release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Initialize signing, publish a new upstream Product Release, publish a same-version OpenWrt hotfix, or retry an exact candidate
        required: true
        type: choice
        options:
          - initialize-signing
          - upstream-release
          - hotfix
          - retry-publish
        default: initialize-signing
      tag:
        description: Required upstream current tag for upstream-release; optional assertion for hotfix/retry-publish
        required: false
        type: string
      seq:
        description: Required upstream sequence for upstream-release; optional assertion for hotfix/retry-publish
        required: false
        type: string
      candidate_run_id:
        description: Earlier trusted release run whose CI and candidate build already succeeded (retry-publish only)
        required: false
        type: string
      environment_public_key_id:
        description: GitHub environment secret encryption key id (public metadata)
        required: false
        type: string
      environment_public_key:
        description: GitHub environment secret encryption key (public metadata)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: openwrt-trusted-release-main
  cancel-in-progress: false

jobs:
  initialize-signing:
    if: inputs.operation == 'initialize-signing' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ENVIRONMENT_PUBLIC_KEY_ID: ${{ inputs.environment_public_key_id }}
      ENVIRONMENT_PUBLIC_KEY: ${{ inputs.environment_public_key }}
    steps:
      - name: Generate the Ed25519 keypair inside GitHub Actions and seal the private key to GitHub
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$ENVIRONMENT_PUBLIC_KEY_ID"
          test -n "$ENVIRONMENT_PUBLIC_KEY"
          work="$RUNNER_TEMP/z2kow-signing-bootstrap"
          mkdir -m 700 "$work"
          private_key="$work/private.pem"
          public_key="$work/public.pem"
          trap 'rm -f "$private_key"' EXIT
          openssl genpkey -algorithm Ed25519 -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          key_id="$(openssl pkey -pubin -in "$public_key" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          [[ "$key_id" =~ ^[0-9a-f]{64}$ ]]
          python3 -m pip install --quiet --disable-pip-version-check pynacl==1.6.2
          python3 - "$private_key" "$public_key" "$work/sealed-secret.json" \
              "$ENVIRONMENT_PUBLIC_KEY_ID" "$ENVIRONMENT_PUBLIC_KEY" "$key_id" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          private_path, public_path, output_path, github_key_id, github_public_key, key_id = sys.argv[1:]
          public_bytes = Path(public_path).read_bytes()
          recipient = PublicKey(base64.b64decode(github_public_key, validate=True))
          encrypted = SealedBox(recipient).encrypt(Path(private_path).read_bytes())
          Path(output_path).write_text(json.dumps({
              "github_key_id": github_key_id,
              "encrypted_value": base64.b64encode(encrypted).decode("ascii"),
              "release_key_id": key_id,
          }) + "\n", encoding="utf-8")
          Path(public_path).write_bytes(public_bytes)
          PY
          rm -f "$private_key"
          printf 'Generated production Ed25519 key id: `%s`\n' "$key_id" >> "$GITHUB_STEP_SUMMARY"
          printf 'Key material sealed for the openwrt-production environment. The artifact contains only the public key and GitHub-encrypted ciphertext.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: z2kow-signing-bootstrap-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/z2kow-signing-bootstrap/public.pem
            ${{ runner.temp }}/z2kow-signing-bootstrap/sealed-secret.json
          if-no-files-found: error
          retention-days: 1

  validate-release:
    if: (inputs.operation == 'upstream-release' || inputs.operation == 'hotfix') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      seq: ${{ steps.validate.outputs.seq }}
      key_id: ${{ steps.validate.outputs.key_id }}
      upstream_commit: ${{ steps.validate.outputs.upstream_commit }}
      plan: ${{ steps.validate.outputs.plan }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_OPERATION_INPUT: ${{ inputs.operation }}
      RELEASE_TAG_INPUT: ${{ inputs.tag }}
      RELEASE_SEQ_INPUT: ${{ inputs.seq }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_KEY_ID: ${{ vars.Z2KOW_RELEASE_KEY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the requested release against the live upstream branch and tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_OPERATION_INPUT" == upstream-release || "$RELEASE_OPERATION_INPUT" == hotfix ]]
          test -z "$CANDIDATE_RUN_ID" || { echo 'candidate_run_id is valid only for retry-publish.' >&2; exit 1; }
          [[ "$RELEASE_KEY_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          key_file="scripts/openwrt/release-keys/$RELEASE_KEY_ID.pub"
          test -s "$key_file"
          key_fingerprint="$(openssl pkey -pubin -in "$key_file" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          test "$key_fingerprint" = "$RELEASE_KEY_ID"

          nonce="$(date +%s%N)"
          curl --fail --location --silent --show-error \
            -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
            "https://raw.githubusercontent.com/necronicle/z2k/z2k-enhanced/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-live-UPDATES.json"
          controlled_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["current"])' UPDATES.json)"
          controlled_seq="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["seq"])' UPDATES.json)"
          if [ "$RELEASE_OPERATION_INPUT" = hotfix ]; then
            if [ -n "$RELEASE_TAG_INPUT" ] && [ "$RELEASE_TAG_INPUT" != "$controlled_tag" ]; then
              echo 'hotfix tag assertion must match the current production version.' >&2; exit 1
            fi
            if [ -n "$RELEASE_SEQ_INPUT" ] && [ "$RELEASE_SEQ_INPUT" != "$controlled_seq" ]; then
              echo 'hotfix sequence assertion must match the current production sequence.' >&2; exit 1
            fi
            RELEASE_TAG_INPUT="$controlled_tag"
            RELEASE_SEQ_INPUT="$controlled_seq"
          fi
          [[ "$RELEASE_TAG_INPUT" =~ ^[pr]-[0-9]+(\.[0-9]+)+$ ]]
          [[ "$RELEASE_SEQ_INPUT" =~ ^[1-9][0-9]*$ ]]
          python3 - "$RUNNER_TEMP/upstream-live-UPDATES.json" "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          wanted_tag, wanted_seq = sys.argv[2], int(sys.argv[3])
          if manifest.get("current") != wanted_tag or manifest.get("seq") != wanted_seq:
              if manifest.get("seq", 0) > wanted_seq:
                  raise SystemExit(
                      f"Upstream version advanced to {manifest.get('current')}. "
                      "\u0422\u0440\u0435\u0431\u0443\u0435\u0442\u0441\u044f \u043d\u043e\u0432\u044b\u0439 Product Release, \u0430 \u043d\u0435 hotfix \u0441\u0442\u0430\u0440\u043e\u0439 \u0432\u0435\u0440\u0441\u0438\u0438."
                  )
              raise SystemExit("upstream live release changed; review the current upstream version before publishing")
          history = manifest.get("history")
          if not isinstance(history, list) or not history or history[-1].get("v") != wanted_tag:
              raise SystemExit("upstream release history does not end at the requested current tag")
          PY

          refs="$(git ls-remote https://github.com/necronicle/z2k.git \
            "refs/heads/z2k-enhanced" "refs/tags/$RELEASE_TAG_INPUT" "refs/tags/$RELEASE_TAG_INPUT^{}")"
          branch_commit="$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/z2k-enhanced" {print $1}')"
          tag_commit="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$RELEASE_TAG_INPUT" '$2 == tag {print $1}')"
          peeled_commit="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$RELEASE_TAG_INPUT^{}" '$2 == tag {print $1}')"
          upstream_commit="${peeled_commit:-$tag_commit}"
          [[ "$branch_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/necronicle/z2k/$upstream_commit/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-pinned-UPDATES.json"
          python3 - "$RUNNER_TEMP/upstream-pinned-UPDATES.json" "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest.get("current") != sys.argv[2] or manifest.get("seq") != int(sys.argv[3]):
              raise SystemExit("upstream tag commit does not contain the requested release manifest")
          PY

          gh api --paginate --jq '.[].tag_name' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/github-release-tags.txt"
          plan_args=(plan --operation "$RELEASE_OPERATION_INPUT" --tag "$RELEASE_TAG_INPUT" \
            --seq "$RELEASE_SEQ_INPUT" --source-sha "$GITHUB_SHA" \
            --upstream "$RUNNER_TEMP/upstream-live-UPDATES.json" --controlled UPDATES.json \
            --upstream-commit "$upstream_commit" --output "$RUNNER_TEMP/publication-plan.json")
          if [ "$RELEASE_OPERATION_INPUT" = upstream-release ] \
              && grep -Fqx -- "$RELEASE_TAG_INPUT" "$RUNNER_TEMP/github-release-tags.txt"; then
            plan_args+=(--product-release-exists)
          fi
          if grep -Fqx -- "openwrt-$GITHUB_SHA" "$RUNNER_TEMP/github-release-tags.txt"; then
            plan_args+=(--technical-release-exists)
          fi
          python3 scripts/openwrt/publication_policy.py "${plan_args[@]}"
          printf 'tag=%s\nseq=%s\nkey_id=%s\nupstream_commit=%s\n' \
            "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" "$RELEASE_KEY_ID" "$upstream_commit" >> "$GITHUB_OUTPUT"
          {
            printf 'plan<<Z2KOW_PUBLICATION_PLAN\n'
            cat "$RUNNER_TEMP/publication-plan.json"
            printf '\nZ2KOW_PUBLICATION_PLAN\n'
          } >> "$GITHUB_OUTPUT"

  ci:
    if: (inputs.operation == 'upstream-release' || inputs.operation == 'hotfix') && github.ref == 'refs/heads/main' && inputs.candidate_run_id == ''
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      openwrt_candidate_version: ${{ needs.validate-release.outputs.tag }}

  prepare-release:
    if: (inputs.operation == 'upstream-release' || inputs.operation == 'hotfix') && github.ref == 'refs/heads/main' && inputs.candidate_run_id == ''
    needs: [validate-release, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RELEASE_OPERATION_INPUT: ${{ inputs.operation }}
      RELEASE_TAG_INPUT: ${{ needs.validate-release.outputs.tag }}
      RELEASE_SEQ_INPUT: ${{ needs.validate-release.outputs.seq }}
      RELEASE_KEY_ID: ${{ needs.validate-release.outputs.key_id }}
      RELEASE_UPSTREAM_COMMIT: ${{ needs.validate-release.outputs.upstream_commit }}
      RELEASE_PLAN_JSON: ${{ needs.validate-release.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
          cache-dependency-path: z2k-warpd/go.sum
      - name: Fetch and recheck the exact upstream manifest validated before CI
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(date +%s%N)"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/necronicle/z2k/$RELEASE_UPSTREAM_COMMIT/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-pinned-UPDATES.json"
          python3 - "$RUNNER_TEMP/upstream-pinned-UPDATES.json" "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest.get("current") != sys.argv[2] or manifest.get("seq") != int(sys.argv[3]):
              raise SystemExit("validated upstream tag no longer contains the requested release manifest")
          PY
      - name: Adapt the release operation into the controlled manifest and build one complete rootfs
        shell: bash
        run: |
          set -euo pipefail
          cp UPDATES.json "$RUNNER_TEMP/production-UPDATES.json"
          if [ "$RELEASE_OPERATION_INPUT" = upstream-release ]; then
            python3 scripts/openwrt/controlled_release.py sync \
              --upstream "$RUNNER_TEMP/upstream-pinned-UPDATES.json" \
              --commit "$RELEASE_UPSTREAM_COMMIT" \
              --output "$RUNNER_TEMP/controlled-UPDATES.json"
          elif [ "$RELEASE_OPERATION_INPUT" = hotfix ]; then
            cp "$RUNNER_TEMP/production-UPDATES.json" "$RUNNER_TEMP/controlled-UPDATES.json"
          else
            echo "unsupported publication operation: $RELEASE_OPERATION_INPUT" >&2; exit 1
          fi
          cp "$RUNNER_TEMP/controlled-UPDATES.json" UPDATES.json
          out="$RUNNER_TEMP/openwrt-release-candidate"
          sh scripts/openwrt/build-release.sh --out "$out"
          python3 scripts/openwrt/controlled_release.py attach \
            --manifest "$out/UPDATES.json" \
            --artifact "$out/openwrt-rootfs.tar.gz" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/openwrt-$GITHUB_SHA/openwrt-rootfs.tar.gz" \
            --key-id "$RELEASE_KEY_ID"
          python3 - "$out/UPDATES.json" "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" "$RELEASE_KEY_ID" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = (sys.argv[2], int(sys.argv[3]), sys.argv[4])
          actual = (manifest.get("current"), manifest.get("seq"), manifest.get("signing", {}).get("key_id"))
          if actual != expected:
              raise SystemExit(f"candidate manifest differs from validated release: {actual!r}")
          PY
          printf 'Prepared complete OpenWrt candidate: %s / seq %s\n' "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$RELEASE_PLAN_JSON" "$out/candidate.json" "$out/UPDATES.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          plan_path, candidate_path, manifest_path, source_sha = sys.argv[1:]
          candidate = json.load(open(plan_path, encoding="utf-8"))
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          if candidate.get("source_sha") != source_sha:
              raise SystemExit("publication plan is not bound to this exact source commit")
          if (candidate.get("tag"), candidate.get("seq")) != (manifest.get("current"), manifest.get("seq")):
              raise SystemExit("candidate metadata differs from its signed manifest version")
          with open(candidate_path, "w", encoding="utf-8") as stream:
              json.dump(candidate, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY
          python3 scripts/openwrt/publication_policy.py notes \
            --candidate "$out/candidate.json" \
            --upstream "$RUNNER_TEMP/upstream-pinned-UPDATES.json" \
            --controlled "$RUNNER_TEMP/production-UPDATES.json" \
            --repository "$GITHUB_WORKSPACE" \
            --output-dir "$out"
      - name: Reconfirm the upstream release did not advance while OpenWrt was building
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(date +%s%N)"
          curl --fail --location --silent --show-error \
            -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
            "https://raw.githubusercontent.com/necronicle/z2k/z2k-enhanced/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-live-after-build-UPDATES.json"
          python3 - "$RUNNER_TEMP/upstream-live-after-build-UPDATES.json" "$RELEASE_TAG_INPUT" "$RELEASE_SEQ_INPUT" "$RELEASE_OPERATION_INPUT" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, seq, operation = sys.argv[2], int(sys.argv[3]), sys.argv[4]
          if manifest.get("current") != tag or manifest.get("seq") != seq:
              if operation == "hotfix" and manifest.get("seq", 0) > seq:
                  raise SystemExit(
                      f"Upstream version advanced to {manifest.get('current')}. "
                      "\u0422\u0440\u0435\u0431\u0443\u0435\u0442\u0441\u044f \u043d\u043e\u0432\u044b\u0439 Product Release, \u0430 \u043d\u0435 hotfix \u0441\u0442\u0430\u0440\u043e\u0439 \u0432\u0435\u0440\u0441\u0438\u0438."
                  )
              raise SystemExit("upstream advanced during the OpenWrt build; review and adapt the current release")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: z2kow-openwrt-release-${{ github.run_id }}
          path: ${{ runner.temp }}/openwrt-release-candidate/
          if-no-files-found: error
          retention-days: 3

  publish-release:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (((inputs.operation == 'upstream-release' || inputs.operation == 'hotfix') &&
        needs.validate-release.result == 'success' && needs.prepare-release.result == 'success') ||
       inputs.operation == 'retry-publish')
    needs: [validate-release, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    environment:
      name: openwrt-production
      url: https://github.com/t0fox/z2kOW/releases
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_KEY_ID: ${{ vars.Z2KOW_RELEASE_KEY_ID }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_TAG_INPUT: ${{ inputs.tag }}
      RELEASE_SEQ_INPUT: ${{ inputs.seq }}
      Z2KOW_RETRY_PUBLISH: ${{ inputs.operation == 'retry-publish' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Revalidate the already-built candidate without rerunning CI or the OpenWrt build
        if: inputs.operation == 'retry-publish'
        id: revalidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_KEY_ID" =~ ^[0-9a-f]{64}$ ]]
          key_file="scripts/openwrt/release-keys/$RELEASE_KEY_ID.pub"
          test -s "$key_file"
          test "$(openssl pkey -pubin -in "$key_file" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')" = "$RELEASE_KEY_ID"

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100")"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100")"
          candidate_source_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          [[ "$candidate_source_sha" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$run_json" "$jobs_json" "$artifacts_json" "$CANDIDATE_RUN_ID" <<'PY'
          import json
          import subprocess
          import sys

          run, jobs_payload, artifacts_payload = map(json.loads, sys.argv[1:4])
          run_id = sys.argv[4]
          if str(run.get("id")) != run_id or run.get("path") != ".github/workflows/release-openwrt.yml":
              raise SystemExit("candidate run is not from the trusted OpenWrt release workflow")
          if (run.get("event"), run.get("head_branch"), run.get("status"), run.get("conclusion")) != (
              "workflow_dispatch", "main", "completed", "failure"
          ):
              raise SystemExit("candidate run must be a completed main release run awaiting publication retry")

          jobs = jobs_payload.get("jobs", [])
          conclusions = {job.get("name"): job.get("conclusion") for job in jobs}
          if conclusions.get("validate-release") != "success" or conclusions.get("prepare-release") != "success":
              raise SystemExit("candidate run did not pass upstream validation and candidate preparation")
          ci_jobs = [job for job in jobs if (job.get("name") or "").startswith("ci / ")]
          if not ci_jobs or any(job.get("conclusion") != "success" for job in ci_jobs):
              raise SystemExit("candidate run did not pass every required CI job")
          if conclusions.get("publish-release") != "failure":
              raise SystemExit("candidate run did not fail only at publish-release")
          unexpected = [
              job.get("name") for job in jobs
              if job.get("conclusion") not in ("success", "skipped")
              and job.get("name") != "publish-release"
          ]
          if unexpected:
              raise SystemExit(f"candidate run has additional failed jobs: {unexpected!r}")

          artifact_name = f"z2kow-openwrt-release-{run_id}"
          artifacts = artifacts_payload.get("artifacts", [])
          if not any(item.get("name") == artifact_name and not item.get("expired") for item in artifacts):
              raise SystemExit("candidate run's complete tested release artifact is missing or expired")

          candidate_sha = run.get("head_sha", "")
          if len(candidate_sha) != 40 or any(char not in "0123456789abcdef" for char in candidate_sha):
              raise SystemExit("candidate run has an invalid source commit")
          subprocess.run(["git", "fetch", "--quiet", "origin", "main"], check=True)
          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", candidate_sha, "FETCH_HEAD"], check=False
          )
          if ancestor.returncode != 0:
              raise SystemExit("candidate source is not an ancestor of current main")
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{candidate_sha}..FETCH_HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          release_control_paths = {
              ".github/workflows/release-openwrt.yml",
              "scripts/openwrt/check_immutable_releases.py",
              "scripts/openwrt/publication_policy.py",
              "scripts/openwrt/publish_release.sh",
              "tests/openwrt/test_ow_immutable_release_check.py",
              "tests/openwrt/test_ow_publication_policy.py",
              "tests/openwrt/test_ow_release_workflow.py",
              "UPDATES.json",
              "UPDATES.json.sig",
          }
          unexpected_paths = set(changed) - release_control_paths
          if unexpected_paths:
              raise SystemExit(
                  "product source changed after this candidate was built: "
                  f"{sorted(unexpected_paths)!r}"
              )
          PY
          printf 'source_sha=%s\n' "$candidate_source_sha" >> "$GITHUB_OUTPUT"
          printf 'Reusing the complete tested candidate from workflow run %s; no CI or build jobs were rerun.\n' \
            "$CANDIDATE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: z2kow-openwrt-release-${{ inputs.candidate_run_id || github.run_id }}
          path: ${{ runner.temp }}/openwrt-release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
      - name: Validate exact candidate metadata and production baseline
        id: candidate
        shell: bash
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.revalidate.outputs.source_sha || github.sha }}
          EXPECTED_NEW_OPERATION: ${{ inputs.operation }}
          EXPECTED_NEW_TAG: ${{ needs.validate-release.outputs.tag }}
          EXPECTED_NEW_SEQ: ${{ needs.validate-release.outputs.seq }}
        run: |
          set -euo pipefail
          args=(candidate-info --candidate "$RUNNER_TEMP/openwrt-release-candidate/candidate.json"
            --source-sha "$CANDIDATE_SOURCE_SHA" --output "$RUNNER_TEMP/candidate-info.txt")
          if [ -n "$RELEASE_TAG_INPUT" ]; then args+=(--tag "$RELEASE_TAG_INPUT"); fi
          if [ -n "$RELEASE_SEQ_INPUT" ]; then args+=(--seq "$RELEASE_SEQ_INPUT"); fi
          python3 scripts/openwrt/publication_policy.py "${args[@]}"
          cat "$RUNNER_TEMP/candidate-info.txt" >> "$GITHUB_OUTPUT"
          if [ "$EXPECTED_NEW_OPERATION" != retry-publish ]; then
            test "$(sed -n 's/^operation=//p' "$RUNNER_TEMP/candidate-info.txt")" = "$EXPECTED_NEW_OPERATION"
            test "$(sed -n 's/^tag=//p' "$RUNNER_TEMP/candidate-info.txt")" = "$EXPECTED_NEW_TAG"
            test "$(sed -n 's/^seq=//p' "$RUNNER_TEMP/candidate-info.txt")" = "$EXPECTED_NEW_SEQ"
          fi
          manifest_state="$(python3 scripts/openwrt/publication_policy.py manifest-state \
            --manifest UPDATES.json --candidate "$RUNNER_TEMP/openwrt-release-candidate/candidate.json")"
          if [ "$EXPECTED_NEW_OPERATION" = retry-publish ]; then
            [[ "$manifest_state" == baseline || "$manifest_state" == published ]]
          else
            test "$manifest_state" = baseline
          fi
          printf 'Production manifest state before signing: %s\n' "$manifest_state" >> "$GITHUB_STEP_SUMMARY"
      - name: Reconfirm live upstream current and exact pinned tag before production signing
        shell: bash
        env:
          EXPECTED_OPERATION: ${{ steps.candidate.outputs.operation }}
          EXPECTED_TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_SEQ: ${{ steps.candidate.outputs.seq }}
          EXPECTED_UPSTREAM_COMMIT: ${{ steps.candidate.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          nonce="$(date +%s%N)"
          curl --fail --location --silent --show-error \
            -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' \
            "https://raw.githubusercontent.com/necronicle/z2k/z2k-enhanced/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-live-before-signing-UPDATES.json"
          python3 - "$RUNNER_TEMP/upstream-live-before-signing-UPDATES.json" "$EXPECTED_TAG" "$EXPECTED_SEQ" "$EXPECTED_OPERATION" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, seq, operation = sys.argv[2], int(sys.argv[3]), sys.argv[4]
          if manifest.get("current") != tag or manifest.get("seq") != seq:
              if operation == "hotfix" and manifest.get("seq", 0) > seq:
                  raise SystemExit(
                      f"Upstream version advanced to {manifest.get('current')}. "
                      "\u0422\u0440\u0435\u0431\u0443\u0435\u0442\u0441\u044f \u043d\u043e\u0432\u044b\u0439 Product Release, \u0430 \u043d\u0435 hotfix \u0441\u0442\u0430\u0440\u043e\u0439 \u0432\u0435\u0440\u0441\u0438\u0438."
                  )
              raise SystemExit("upstream changed before production signing; review the current release")
          PY
          refs="$(git ls-remote https://github.com/necronicle/z2k.git \
            "refs/tags/$EXPECTED_TAG" "refs/tags/$EXPECTED_TAG^{}")"
          tag_commit="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$EXPECTED_TAG" '$2 == tag {print $1}')"
          peeled_commit="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$EXPECTED_TAG^{}" '$2 == tag {print $1}')"
          upstream_commit="${peeled_commit:-$tag_commit}"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$upstream_commit" = "$EXPECTED_UPSTREAM_COMMIT"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/necronicle/z2k/$upstream_commit/UPDATES.json?nocache=$nonce" \
            -o "$RUNNER_TEMP/upstream-pinned-before-signing-UPDATES.json"
          python3 - "$RUNNER_TEMP/upstream-pinned-before-signing-UPDATES.json" "$EXPECTED_TAG" "$EXPECTED_SEQ" <<'PY'
          import json
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if manifest.get("current") != sys.argv[2] or manifest.get("seq") != int(sys.argv[3]):
              raise SystemExit("pinned upstream tag does not contain the approved current release")
          PY
      - name: Sign and verify the exact final manifest with the protected production key
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.Z2KOW_RELEASE_PRIVATE_KEY }}
          EXPECTED_TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_SEQ: ${{ steps.candidate.outputs.seq }}
          EXPECTED_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY"
          [[ "$RELEASE_KEY_ID" =~ ^[0-9a-f]{64}$ ]]
          key_file="scripts/openwrt/release-keys/$RELEASE_KEY_ID.pub"
          test -s "$key_file"
          test "$(openssl pkey -pubin -in "$key_file" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')" = "$RELEASE_KEY_ID"
          manifest="$RUNNER_TEMP/openwrt-release-candidate/UPDATES.json"
          artifact="$RUNNER_TEMP/openwrt-release-candidate/openwrt-rootfs.tar.gz"
          python3 - "$manifest" "$EXPECTED_TAG" "$EXPECTED_SEQ" "$EXPECTED_SOURCE_SHA" "$RELEASE_KEY_ID" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys
          path, tag, seq, source_sha, key_id, repository = sys.argv[1:]
          manifest = json.load(open(path, encoding="utf-8"))
          if (manifest.get("current"), manifest.get("seq")) != (tag, int(seq)):
              raise SystemExit("candidate manifest user version differs from candidate metadata")
          if manifest.get("signing", {}).get("key_id") != key_id:
              raise SystemExit("candidate manifest signing key id differs from the protected production key")
          expected_url = (
              f"https://github.com/{repository}/releases/download/"
              f"openwrt-{source_sha}/openwrt-rootfs.tar.gz"
          )
          if manifest.get("artifact", {}).get("url") != expected_url:
              raise SystemExit("candidate artifact URL is not bound to its exact source commit")
          PY
          umask 077
          private_key="$RUNNER_TEMP/z2kow-production-release.pem"
          trap 'rm -f "$private_key"' EXIT
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$private_key"
          unset RELEASE_PRIVATE_KEY
          python3 scripts/openwrt/sign_release.py sign \
            --manifest "$manifest" --artifact "$artifact" \
            --signature "$RUNNER_TEMP/openwrt-release-candidate/UPDATES.json.sig" \
            --private-key "$private_key"
          python3 scripts/openwrt/sign_release.py verify \
            --manifest "$manifest" --artifact "$artifact" \
            --signature "$RUNNER_TEMP/openwrt-release-candidate/UPDATES.json.sig" \
            --public-key "$key_file"
          rm -f "$private_key"
      - name: Publish immutable technical payload and optional Product Release
        shell: bash
        env:
          Z2KOW_IMMUTABILITY_TOKEN: ${{ secrets.Z2KOW_IMMUTABILITY_TOKEN }}
        run: bash scripts/openwrt/publish_release.sh "$RUNNER_TEMP/openwrt-release-candidate"
