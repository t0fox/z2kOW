name: OpenWrt unsigned candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-candidate-main
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
          cache-dependency-path: z2k-warpd/go.sum
      - name: Run OpenWrt regression suite
        run: sh tests/openwrt/run.sh
      - name: Test upstream WARP engine and build every supported OpenWrt architecture
        run: sh scripts/openwrt/build-release.sh --out "$RUNNER_TEMP/openwrt-candidate"
      - name: Verify candidate is unsigned and contains one complete payload
        run: |
          set -eu
          test -s "$RUNNER_TEMP/openwrt-candidate/openwrt-rootfs.tar.gz"
          test -s "$RUNNER_TEMP/openwrt-candidate/UPDATES.json"
          test ! -e "$RUNNER_TEMP/openwrt-candidate/UPDATES.json.sig"
          python3 tests/openwrt/test_ow_payload_bundle.py
          python3 tests/openwrt/test_ow_controlled_artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: z2kow-openwrt-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/openwrt-candidate/
          if-no-files-found: error
          retention-days: 30
