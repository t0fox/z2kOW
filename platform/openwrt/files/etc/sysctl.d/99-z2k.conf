# /etc/sysctl.d/99-z2k.conf - TCP tuning z2k (parity lib/install.sh step_tcp_tuning).
#
# Поднимаем TCP-буферы, чтобы одиночная WS-сессия туннеля к Telegram relay/VPS
# не упиралась в ~2 Мбит/с (16 КБ окно при 65 мс). Значения — те же, что ставит
# upstream: rmem/wmem 4096 524288 4194304, максимумы 4194304.
# BBR здесь НЕТ осознанно: upstream пробует его в рантайме с silent fallback,
# а статическая строка шумела бы в boot-лог на ядрах без модуля (postinst
# пробует `sysctl -w ...bbr` best-effort отдельно). package-owned, conffiles
# нет (Model A: код, а не user-config).
net.ipv4.tcp_rmem = 4096 524288 4194304
net.ipv4.tcp_wmem = 4096 524288 4194304
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
