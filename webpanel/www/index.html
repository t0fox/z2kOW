<script>
  /* No-FOUC theme bootstrap — runs before style.css загружается.
     Без него юзер с сохранённой светлой темой увидит мигание тёмной
     перед applyTheme() из app.js. */
  (function() {
    try {
      var mode = localStorage.getItem('z2k-theme') || 'auto';
      var resolved = mode === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : mode;
      if (resolved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { /* localStorage disabled — остаёмся на dark default */ }
  })();
</script>

<script>
  // Package-owned static profile is the OpenWrt identity source of first
  // paint. It is independent of /status and falls back to z2kOW.
  (function () {
    window.__z2kBrandName = "z2kOW";
    function label(value) {
      return typeof value === "string" && value.trim().length > 0
        && value.trim().length <= 64 && !/[\u0000-\u001f\u007f]/.test(value)
        ? value.trim() : "";
    }
    function asset(value, extension) {
      return typeof value === "string" && value.length <= 160
        && new RegExp("^/assets/[A-Za-z0-9/_-]+\\." + extension + "$").test(value)
        && !value.includes("..") && !value.includes("\\") && !/[\s?#]/.test(value)
        ? value : "";
    }
    fetch("/assets/openwrt/profile.json", { credentials: "same-origin", cache: "no-cache" })
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (profile) {
        if (!profile) return;
        var name = label(profile.name), subtitle = label(profile.subtitle);
        var logo = asset(profile.logo, "png"), favicon = asset(profile.favicon, "svg");
        var theme = asset(profile.theme, "css");
        if (!name || !subtitle || !logo || !favicon || !theme) return;
        var brand = document.getElementById("panel-brand");
        var image = document.getElementById("brand-profile-logo");
        var wordmark = document.getElementById("brand-wordmark");
        var logoSvg = document.getElementById("brand-composite-logo");
        var icon = document.getElementById("brand-favicon");
        var mask = document.getElementById("brand-mask-icon");
        if (!brand || !image || !wordmark || !logoSvg || !icon || !mask) return;
        logoSvg.querySelectorAll("[data-brand-source]").forEach(function (source) {
          source.setAttribute("href", logo);
        });
        brand.classList.add("brand-composite");
        wordmark.textContent = name;
        brand.setAttribute("aria-label", name + " — " + subtitle);
        icon.href = favicon;
        mask.href = favicon;
        var themeLink = document.getElementById("brand-profile-theme");
        if (!themeLink) {
          themeLink = document.createElement("link");
          themeLink.id = "brand-profile-theme";
          themeLink.rel = "stylesheet";
          document.head.appendChild(themeLink);
        }
        if (themeLink.href !== new URL(theme, document.baseURI).href) themeLink.href = theme;
        window.__z2kBrandName = name;
        if (typeof window.__z2kRefreshRouteTitle === "function") window.__z2kRefreshRouteTitle();
      })
      .catch(function () { /* profile is optional; the z2kOW fallback remains usable */ });
  })();
  window.addEventListener("error", function (event) {
    var target = event.target;
    if (target && target.tagName === "SCRIPT" && target.dataset
        && target.dataset.optionalPanelModule === "true") return;
    if (!target || target.tagName !== "SCRIPT" || target.type === "module") {
      var app = document.getElementById("app");
      if (app && !app.querySelector("[data-ui-fatal]")) {
        app.innerHTML = '<section class="card" data-ui-fatal role="alert"><h1 class="page-title">Не удалось загрузить интерфейс</h1><p class="desc">Обновите страницу. Проверьте, не блокирует ли браузер обязательный файл интерфейса.</p></section>';
      }
    }
  }, true);
</script>
<!-- Точка входа — ES-модуль. Вся работа в js/, разложена по слоям; связность
     мерена по AST, граф ациклический (см. шапку app.js).
     Модуль откладывается до разбора разметки, как и прежний тег в конце body. -->
<script type="module" src="app.js?v=p-86.13"></script>
<!-- Браузер без модулей (старше 2018 года) молча не выполнил бы НИЧЕГО и
     показал бы пустую страницу без единого объяснения. -->
<script nomodule>
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.getElementById("app");
    if (a) a.innerHTML = '<div class="card"><h2>Браузер слишком старый</h2>' +
      '<p class="desc">Панель использует модули JavaScript — их поддерживают ' +
      'браузеры с 2018 года. Откройте её в более новом браузере.</p></div>';
  });
</script>
